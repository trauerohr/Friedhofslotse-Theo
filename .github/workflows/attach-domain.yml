name: Attach Friedhofslotse Theo domains

on:
  workflow_dispatch:

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Attach custom domains to Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID"
          TOKEN="$CLOUDFLARE_API_TOKEN"
          PROJECT="trauerguide"
          API="https://api.cloudflare.com/client/v4"

          echo "Account ID length: ${#ACCOUNT_ID}"
          echo "Token length: ${#TOKEN}"

          echo "== List Pages projects =="
          curl -sS -H "Authorization: Bearer $TOKEN" \
            "$API/accounts/$ACCOUNT_ID/pages/projects?per_page=50" \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); print("success", d.get("success"));
print("errors", d.get("errors"));
[print("-", p.get("name"), "domains=", p.get("domains"), "branch=", p.get("production_branch"), "repo=", ((p.get("source") or {}).get("config") or {}).get("owner") ,"/", ((p.get("source") or {}).get("config") or {}).get("repo_name")) for p in (d.get("result") or [])]'

          for DOMAIN in friedhofslotse-theo.de www.friedhofslotse-theo.de; do
            echo "== Add domain $DOMAIN =="
            RESP=$(curl -sS -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              "$API/accounts/$ACCOUNT_ID/pages/projects/$PROJECT/domains" \
              --data "{\"name\":\"$DOMAIN\"}")
            echo "$RESP" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(json.dumps(d, indent=2)[:4000])'
          done

          echo "== Current domains on project =="
          curl -sS -H "Authorization: Bearer $TOKEN" \
            "$API/accounts/$ACCOUNT_ID/pages/projects/$PROJECT/domains" \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); print(json.dumps(d, indent=2)[:6000])'

          echo "== Zones (for DNS options) =="
          curl -sS -H "Authorization: Bearer $TOKEN" \
            "$API/zones?per_page=50" \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); print("success", d.get("success"));
[print("-", z.get("name"), z.get("status"), z.get("id")) for z in (d.get("result") or [])]'
